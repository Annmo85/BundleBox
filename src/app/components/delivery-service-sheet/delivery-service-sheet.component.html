<div class="sheet-wrapper">

  <div class="sheet-title">Выберите службу доставки</div>

  <div class="sheet-option ion-activatable" (click)="select('ozon')">
    <div class="sheet-option-title">Доставка в пункт выдачи Озон</div>
    <div class="sheet-option-arrow">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20">
        <path stroke="#2D2D2D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="m7.5 4.167 5 5.833-5 5.833" />
      </svg>
    </div>
    <ion-ripple-effect></ion-ripple-effect>
  </div>

  <div class="sheet-option ion-activatable" (click)="select('sova')">
    <div class="sheet-option-title">Доставка в пункт выдачи SOVA</div>
    <div class="sheet-option-arrow">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20">
        <path stroke="#2D2D2D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="m7.5 4.167 5 5.833-5 5.833" />
      </svg>
    </div>
    <ion-ripple-effect></ion-ripple-effect>
  </div>

</div>
