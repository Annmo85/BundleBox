<app-header2 title="Выберите ПВЗ Озон" [has_back]="true"></app-header2>

<ion-content >

  <div class="page-wrapper">
    <div class="search-panel">
      <div class="search-bar">
        <ion-icon class="search-icon" name="search-outline"></ion-icon>
        <input
          class="search-input"
          type="search"
          inputmode="search"
          placeholder="Поиск адреса или города"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          [value]="search_query"
          (input)="onSearchInput($event)"
          (keydown.enter)="onSearchSubmit($event)"
        />
        <ion-spinner *ngIf="search_loading" class="search-spinner" name="crescent"></ion-spinner>
        <button
          *ngIf="!search_loading && search_query.length > 0"
          class="search-clear"
          type="button"
          aria-label="Очистить поиск"
          (click)="clearSearch()"
        >
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>

      <div class="search-error" *ngIf="search_error">{{ search_error }}</div>

      <div class="search-results" *ngIf="search_results.length > 0">
        <button
          *ngFor="let result of search_results"
          class="search-result"
          type="button"
          (click)="selectSearchResult(result)"
        >
          <span class="search-result-title">{{ result.title }}</span>
          <span class="search-result-subtitle" *ngIf="result.subtitle">{{ result.subtitle }}</span>
        </button>
      </div>
    </div>

    <div #mapContainer class="yandex-map"></div>

    <div class="map-overlay" *ngIf="!map_ready">
      <ion-spinner *ngIf="!map_error" name="crescent"></ion-spinner>
      <div class="map-overlay-text">{{ map_error ? map_error : 'Загрузка карты…' }}</div>
    </div>

    <div class="pvz-status" *ngIf="map_ready && pvz_loading">
      <ion-spinner name="crescent"></ion-spinner>
      <span>Поиск ПВЗ…</span>
    </div>

    <div class="pvz-error" *ngIf="map_ready && pvz_error && !pvz_loading">
      {{ pvz_error }}
    </div>

    <div class="pvz-card" *ngIf="selected_pvz">
      <div class="pvz-card-head">
        <span class="pvz-card-title">{{ selected_pvz.name || 'ПВЗ Ozon' }}</span>
        <button
          class="pvz-card-close"
          type="button"
          aria-label="Закрыть"
          (click)="clearSelectedPvz()"
        >
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>
      <div class="pvz-card-address" *ngIf="selected_pvz.address">
        {{ selected_pvz.address }}
      </div>
      <div class="pvz-card-meta">
        <span *ngIf="selected_pvz.delivery_point_number">
          № {{ selected_pvz.delivery_point_number }}
        </span>
        <span *ngIf="selected_pvz.storage_period_days as storageDays">
          хранение {{ storageDays }} дн.
        </span>
      </div>
      <button
        class="pvz-card-submit"
        type="button"
        [disabled]="pvz_saving"
        (click)="confirmSelectedPvz()"
      >
        Выбрать этот ПВЗ
      </button>
    </div>
  </div>

</ion-content>
